<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Yönetim Listesi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #1a73e8;
            margin-bottom: 20px;
            text-align: center;
            font-size: 24px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            font-size: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #1a73e8;
        }

        button.btn-add {
            padding: 10px 18px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn-add:hover {
            background-color: #1557b0;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        ul.student-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        ul.student-list li {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: #333;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }

        .btn-delete:hover {
            background-color: #bd2130;
        }

        .empty-msg {
            text-align: center;
            color: #888;
            font-size: 14px;
            padding: 15px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Öğrenci Listesi</h2>

        <form id="studentForm">
            <div class="input-group">
                <input type="text" id="studentInput" placeholder="Öğrenci adını giriniz..." autocomplete="off">
                <button type="submit" class="btn-add">Ekle</button>
            </div>
        </form>

        <div class="stats">
            <span>Toplam Öğrenci: <strong id="totalCount">0</strong></span>
        </div>

        <ul class="student-list" id="studentList">
            <!-- Listeye eklenen öğrenciler dinamik olarak buraya eklenecektir -->
        </ul>
        <div id="emptyMessage" class="empty-msg">Henüz öğrenci eklenmedi.</div>
    </div>

    <script>
        // DOM Elemanlarının Seçimi
        const studentForm = document.getElementById('studentForm');
        const studentInput = document.getElementById('studentInput');
        const studentList = document.getElementById('studentList');
        const totalCount = document.getElementById('totalCount');
        const emptyMessage = document.getElementById('emptyMessage');

        // Öğrenci verisini tutan dizi
        let students = [];

        // Sayfa yüklendiğinde odağı inputa ver
        window.addEventListener('DOMContentLoaded', () => {
            studentInput.focus();
        });

        // Form Submit Olayı
        studentForm.addEventListener('submit', function(event) {
            // Formun varsayılan yönlendirmesini/sayfa yenilemesini engeller
            event.preventDefault();

            const name = studentInput.value.trim();

            // Geçerlilik Kontrolleri
            if (name === "") {
                alert("Lütfen geçerli bir öğrenci adı giriniz.");
                return;
            }

            // Yeni öğrenciyi diziye ekle
            students.push(name);

            // Arayüzü Güncelle
            renderList();

            // Input alanını temizle ve tekrar odaklan
            studentInput.value = "";
            studentInput.focus();
        });

        // Listeyi Ekran Üzerinde Güncelleyen Fonksiyon
        function renderList() {
            // Liste içeriğini temizle
            studentList.innerHTML = "";

            if (students.length === 0) {
                emptyMessage.style.display = "block";
            } else {
                emptyMessage.style.display = "none";
            }

            // Dizideki her öğrenci için HTML elemanı oluştur
            students.forEach((student, index) => {
                const li = document.createElement('li');
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = student;

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Sil';
                deleteBtn.className = 'btn-delete';
                deleteBtn.onclick = function() {
                    removeStudent(index);
                };

                li.appendChild(nameSpan);
                li.appendChild(deleteBtn);
                studentList.appendChild(li);
            });

            // Toplam sayıyı güncelle
            totalCount.textContent = students.length;
        }

        // Öğrenci Silme Fonksiyonu
        function removeStudent(index) {
            students.splice(index, 1);
            renderList();
        }
    </script>
</body>
</html>
